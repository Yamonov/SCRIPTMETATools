[package]
name = "scriptmetakitmini"
version = "1.5.0"
description = "Cross-platform desktop tool for inspecting and editing SCRIPTMETA metadata."
authors = ["Murakami Yoshiteru"]
edition = "2024"
rust-version = "1.94"
license = "MIT"
publish = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "scriptmetakitmini_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
scriptmetakit = { git = "https://github.com/Yamonov/SCRIPTMETAKit.git", tag = "2.1.1", features = ["blocking-http"] }
rfd = "0.16"
