[package]
name = "scriptmetakitcli"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
description = "Cross-platform command-line interface for SCRIPTMETAKit."
license = "MIT"
publish = false

[[bin]]
name = "scriptmeta"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.5"
ctrlc = "3.4"
humantime = "2"
scriptmetakit = { git = "https://github.com/Yamonov/SCRIPTMETAKit.git", tag = "1.2.2", features = ["blocking-http"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
url = "2"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = "deny"
